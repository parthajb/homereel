plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.parthajb.homereel.server'
    compileSdk 34

    defaultConfig {
        applicationId 'com.parthajb.homereel.server'
        minSdk 26
        targetSdk 34
        // -PhomereelVersion=3 builds a "newer" copy, for trying an update without ADB.
        versionCode((project.findProperty('homereelVersion') ?: '3') as int)
        versionName project.hasProperty('homereelVersion') ? "0.2.${project.findProperty('homereelVersion')}" : '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded, never published: the debug key lets a release install over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':shared')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // Only for reading each file's tracks (MetadataRetriever): the phone never plays anything.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // Lighter copies of very heavy files, with the phone's hardware encoder (Optimizer).
    implementation 'androidx.media3:media3-transformer:1.4.1'
}
