plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.parthajb.homereel.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.parthajb.homereel.tv'
        // The same floor as the cleanyourtv launcher.
        minSdk 26
        targetSdk 34
        // -PhomereelVersion=7 builds a "newer" copy, for trying an update without ADB.
        versionCode((project.findProperty('homereelVersion') ?: '7') as int)
        versionName project.hasProperty('homereelVersion') ? "0.3.${project.findProperty('homereelVersion')}" : '0.6.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: the debug key lets a release install over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':shared')
    // Leanback is only used for the player's controls now; the home and details screens are plain views.
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui-leanback:1.4.1'
    // Only for SubtitleView: Leanback's video fragment draws no subtitles of its own.
    implementation 'androidx.media3:media3-ui:1.4.1'
}
