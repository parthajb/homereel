# Runs what CONTRIBUTING.md asks before a pull request: the unit tests, lint on both apps, and both release builds.
# It builds nothing for download: there are no prebuilt APKs, and none are kept here.
name: Checks

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Checks the Gradle wrapper jar against Gradle's published checksums, then caches Gradle's downloads.
      - uses: gradle/actions/setup-gradle@v4

      # The runner's Android SDK is found through ANDROID_HOME; Gradle adds platform 34 if the image lacks it.
      - name: Tests, lint and release builds
        run: ./gradlew --no-daemon :shared:test :server:lintRelease :tv:lintRelease :server:assembleRelease :tv:assembleRelease

      # Only the reports, to see why a check failed.
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            shared/build/reports/
            server/build/reports/
            tv/build/reports/
          retention-days: 7
